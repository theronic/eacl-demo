AWSTemplateFormatVersion: "2010-09-09"
Description: EACL demo private static delivery; server APIs use direct Lambda Function URLs.

Parameters:
  StaticBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  StaticBucketArn:
    Type: String
    AllowedPattern: "^arn:[a-z0-9-]+:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  StaticBucketRegionalDomainName:
    Type: String
    AllowedPattern: "^[a-z0-9.-]+\\.amazonaws\\.com$"
  StaticOriginAccessControlId:
    Type: String
    MinLength: 1
  DomainName:
    Type: String
    AllowedPattern: "^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
  CertificateArn:
    Type: String
    AllowedPattern: "^arn:[a-z0-9-]+:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$"

Resources:
  StaticViewerRequestRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/datascript' || request.uri === '/datascript/') {
            request.uri = '/datascript/index.html';
          }
          if (request.uri === '/datahike' || request.uri === '/datahike/') {
            request.uri = '/index.html';
          }
          return request;
        }
      FunctionConfig:
        Comment: Rewrite only the two static Explorer entry routes.
        Runtime: cloudfront-js-2.0
      Name: !Sub "${AWS::StackName}-static-rewrite"

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Bounded static caching; origin Cache-Control may reduce the TTL.
        DefaultTTL: 300
        MaxTTL: 31536000
        MinTTL: 0
        Name: !Sub "${AWS::StackName}-static"
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Comment: Security headers for the two static Explorer entries.
        Name: !Sub "${AWS::StackName}-security"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://y66owmoqebrcmzyfw6uturkaue0exoqe.lambda-url.us-east-1.on.aws https://ammics5svacgyu5eopgicnzz3y0lsryk.lambda-url.us-east-1.on.aws https://nkpogjjpx5wyb4imujlrefedqu0qpqwu.lambda-url.us-east-1.on.aws https://cjg7vmjzdhpomcjac3nxgp5ina0iwakt.lambda-url.us-east-1.on.aws https://kfhndav4wq4rtmyugoriekcztm0mjrza.lambda-url.us-east-1.on.aws https://7um6u6hb6wq6yfl46ukjkxcpuy0gexer.lambda-url.us-east-1.on.aws https://datomic.demo.eacl.dev https://n56bfv3ompn6h4cqnxsi5bhavm0gwfrm.lambda-url.us-east-1.on.aws; worker-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
            Preload: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: [!Ref DomainName]
        CacheBehaviors:
          - PathPattern: datascript/*
            TargetOriginId: static
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StaticViewerRequestRewrite.FunctionARN
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            ViewerProtocolPolicy: redirect-to-https
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref StaticCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt StaticViewerRequestRewrite.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: static
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !Ref StaticBucketRegionalDomainName
            Id: static
            OriginAccessControlId: !Ref StaticOriginAccessControlId
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Project
          Value: eacl-demo
        - Key: Component
          Value: static-routing

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${StaticBucketArn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SecurityHeadersPolicyId:
    Value: !Ref SecurityHeadersPolicy
