AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated t3.micro for the immutable Datalevin demo, sharing only the existing demo network.
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  SubnetId: {Type: 'AWS::EC2::Subnet::Id'}
  AmiId: {Type: 'AWS::EC2::Image::Id', Default: ami-0332d564d76dbd8d6}
  ArtifactBucket: {Type: String}
  ArtifactKey: {Type: String, AllowedPattern: '^artifacts/datalevin-memory/[0-9a-f]{40}/[0-9a-f]{64}\.jar$'}
  ArtifactVersion: {Type: String}
  ArtifactSha256: {Type: String, AllowedPattern: '^[0-9a-f]{64}$'}
  DemoSha: {Type: String, AllowedPattern: '^[0-9a-f]{40}$'}
  EaclSha: {Type: String, AllowedPattern: '^[0-9a-f]{40}$'}
  DeploymentId: {Type: String}
  HostedZoneId: {Type: String, Default: Z05228481ZHF8BAKXOZB2}
  OriginDomainName: {Type: String, Default: datalevin-origin.demo.eacl.dev, AllowedValues: [datalevin-origin.demo.eacl.dev]}
  CloudFrontPrefixListId: {Type: String, Default: pl-3b927c52}
  AlarmTopicArn: {Type: String, Default: 'arn:aws:sns:us-east-1:843761893873:eacl-demo-alarms'}
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront-only ingress to dedicated Datalevin.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8081, ToPort: 8081, SourcePrefixListId: !Ref CloudFrontPrefixListId}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Project, Value: eacl-demo}, {Key: Profile, Value: datalevin-memory}]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: exact-datalevin-artifact-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion']
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/artifacts/datalevin-memory/*'
        - PolicyName: exact-datalevin-log-delivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:DescribeLogStreams', 'logs:PutLogEvents']
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ec2/eacl-demo-datalevin-memory:*'
      Tags: [{Key: Project, Value: eacl-demo}, {Key: Profile, Value: datalevin-memory}]
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref InstanceProfile
      CreditSpecification: {CPUCredits: standard}
      MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, InstanceMetadataTags: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {DeleteOnTermination: true, Encrypted: true, VolumeSize: 8, VolumeType: gp3}
      NetworkInterfaces:
        - {AssociatePublicIpAddress: false, DeleteOnTermination: true, DeviceIndex: '0', GroupSet: [!Ref SecurityGroup], SubnetId: !Ref SubnetId}
      Tags:
        - {Key: Name, Value: eacl-demo-datalevin-memory-ec2}
        - {Key: Project, Value: eacl-demo}
        - {Key: Profile, Value: datalevin-memory}
        - {Key: Platform, Value: ec2}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/eacl-demo-bootstrap.log 2>&1
          dnf install -y java-25-amazon-corretto-headless amazon-cloudwatch-agent awscli
          install -d -m 0755 /opt/eacl-demo /var/log/eacl-demo
          fallocate -l 1G /swapfile
          chmod 0600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          echo 'vm.swappiness=10' > /etc/sysctl.d/90-eacl-demo-swap.conf
          sysctl -p /etc/sysctl.d/90-eacl-demo-swap.conf
          touch /opt/eacl-demo/bootstrap-ready
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc, Tags: [{Key: Project, Value: eacl-demo}, {Key: Profile, Value: datalevin-memory}]}
  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties: {AllocationId: !GetAtt ElasticIp.AllocationId, InstanceId: !Ref Instance}
  OriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginDomainName
      Type: A
      TTL: '60'
      ResourceRecords: [!Ref ElasticIp]
  RuntimeAssociation:
    Type: AWS::SSM::Association
    DependsOn: ElasticIpAssociation
    Properties:
      AssociationName: eacl-demo-datalevin-dedicated-runtime
      Name: AWS-RunShellScript
      Targets: [{Key: InstanceIds, Values: [!Ref Instance]}]
      WaitForSuccessTimeoutSeconds: 900
      Parameters:
        commands:
          - !Sub |
              set -euo pipefail
              for attempt in $(seq 1 300); do test -f /opt/eacl-demo/bootstrap-ready && break; sleep 2; done
              test -f /opt/eacl-demo/bootstrap-ready
              install -d -m 0700 /var/lib/eacl-demo/datalevin
              aws s3api get-object --region ${AWS::Region} --bucket ${ArtifactBucket} --key ${ArtifactKey} --version-id ${ArtifactVersion} /opt/eacl-demo/datalevin.jar.next
              echo '${ArtifactSha256}  /opt/eacl-demo/datalevin.jar.next' | sha256sum --check --strict
              install -m 0644 /opt/eacl-demo/datalevin.jar.next /opt/eacl-demo/datalevin.jar
              cursor_key=$(sed -n 's/^EACL_CURSOR_KEY=//p' /etc/eacl-demo-datalevin.env 2>/dev/null || true)
              if test $(printf '%s' "$cursor_key" | wc -c) -lt 32; then cursor_key=$(head -c 48 /dev/urandom | base64 | tr -d '\n'); fi
              install -m 0600 /dev/null /etc/eacl-demo-datalevin.env
              {
                echo 'AWS_LAMBDA_FUNCTION_NAME=eacl-demo-datalevin-memory-ec2'
                echo 'EACL_ARTIFACT_SHA256=${ArtifactSha256}'
                echo 'EACL_CORE_SHA=${EaclSha}'
                echo "EACL_CURSOR_KEY=$cursor_key"
                echo 'EACL_DEMO_SHA=${DemoSha}'
                echo 'EACL_DEPLOYMENT_ID=${DeploymentId}'
                echo 'EACL_DATALEVIN_DIRECTORY=/var/lib/eacl-demo/datalevin'
                echo 'EACL_HTTP_PORT=8081'
                echo 'EACL_HTTP_WORKERS=1'
                echo 'EACL_MAXIMUM_CONCURRENCY=1'
                echo 'EACL_RUNTIME_EXECUTION=ec2'
                echo 'EACL_RUNTIME_MEMORY_MIB=1024'
              } > /etc/eacl-demo-datalevin.env
              cat > /etc/systemd/system/eacl-demo-datalevin.service <<'SERVICE'
              [Unit]
              Description=EACL read-only Datalevin embedded demo
              Wants=network-online.target
              After=network-online.target
              [Service]
              Type=simple
              EnvironmentFile=/etc/eacl-demo-datalevin.env
              ExecStart=/usr/bin/java -Xms64m -Xmx224m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:+UseG1GC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:G1PeriodicGCInterval=10000 -XX:+ExitOnOutOfMemoryError --enable-native-access=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -cp /opt/eacl-demo/datalevin.jar clojure.main -m eacl-demo.datalevin-memory.http-server
              Restart=on-failure
              RestartSec=3
              TimeoutStopSec=15
              MemoryHigh=320M
              MemoryMax=352M
              TasksMax=128
              StandardOutput=append:/var/log/eacl-demo/datalevin.log
              StandardError=append:/var/log/eacl-demo/datalevin.log
              NoNewPrivileges=true
              PrivateTmp=true
              [Install]
              WantedBy=multi-user.target
              SERVICE
              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'AGENT'
              {"logs":{"logs_collected":{"files":{"collect_list":[
                {"file_path":"/var/log/eacl-demo/datalevin.log","log_group_name":"/aws/ec2/eacl-demo-datalevin-memory","log_stream_name":"{instance_id}/runtime"},
                {"file_path":"/var/log/eacl-demo-bootstrap.log","log_group_name":"/aws/ec2/eacl-demo-datalevin-memory","log_stream_name":"{instance_id}/bootstrap"}
              ]}}}}
              AGENT
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
              systemctl daemon-reload
              systemctl enable --now eacl-demo-datalevin.service
              for attempt in $(seq 1 180); do curl --fail --silent http://127.0.0.1:8081/health >/dev/null && exit 0; sleep 2; done
              systemctl status eacl-demo-datalevin.service --no-pager
              exit 1
  StatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: eacl-demo-datalevin-ec2-status
      AlarmActions: [!Ref AlarmTopicArn]
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  InstanceId: {Value: !Ref Instance}
  OriginDomainName: {Value: !Ref OriginDomainName}
  OriginAddress: {Value: !Ref ElasticIp}
