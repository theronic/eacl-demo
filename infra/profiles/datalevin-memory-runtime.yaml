AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only public Datalevin embedded Java Lambda demo.

Metadata:
  EaclDemo:
    Profile: datalevin-memory
    Runtime: java25
    Architecture: arm64
    Storage: embedded
    SnapshotBehavior: request-snapshot
    SnapStartPolicy: published-version-preinitialized-reader

Parameters:
  FunctionName:
    Type: String
    AllowedPattern: "^eacl-demo-datalevin-memory-[a-z0-9-]{3,37}$"
  ArtifactBucket:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  ArtifactKey:
    Type: String
    AllowedPattern: "^artifacts/datalevin-memory/[0-9a-f]{40}/[0-9a-f]{64}\\.jar$"
  ArtifactVersion:
    Type: String
    MinLength: 1
    MaxLength: 1024
  ArtifactSha256:
    Type: String
    AllowedPattern: "^[0-9a-f]{64}$"
  DemoSha:
    Type: String
    AllowedPattern: "^[0-9a-f]{40}$"
  EaclSha:
    Type: String
    Default: 11114f59fa57fe87c5b7ab412b3123a9c8a1a862
    AllowedValues:
      - 11114f59fa57fe87c5b7ab412b3123a9c8a1a862
  DeploymentId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$"
  CursorKey:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 256
    AllowedPattern: "^[ -~]{32,256}$"
  MemorySize:
    Type: Number
    Default: 1769
    AllowedValues: [1769]
    Description: Production is fixed at 1769 MB to provide one full vCPU without paying for excess memory.
  CandidateAliasName:
    Type: String
    Default: candidate
    AllowedPattern: "^(?![0-9]+$)[A-Za-z0-9_-]{1,128}$"

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: eacl-demo
        - Key: Profile
          Value: datalevin-memory

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exact-function-log-delivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*"
      Tags:
        - Key: Project
          Value: eacl-demo
        - Key: Profile
          Value: datalevin-memory
        - Key: Access
          Value: logs-only

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      Architectures:
        - arm64
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
        S3ObjectVersion: !Ref ArtifactVersion
      Environment:
        Variables:
          EACL_ARTIFACT_SHA256: !Ref ArtifactSha256
          EACL_CORE_SHA: !Ref EaclSha
          EACL_CURSOR_KEY: !Ref CursorKey
          EACL_DATALEVIN_DIRECTORY: /tmp/eacl-demo-datalevin
          EACL_DEMO_SHA: !Ref DemoSha
          EACL_DEPLOYMENT_ID: !Ref DeploymentId
          JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
      EphemeralStorage:
        Size: 512
      FunctionName: !Ref FunctionName
      Handler: eacl_demo.datalevin_memory.LambdaHandler::handleRequest
      MemorySize: !Ref MemorySize
      PackageType: Zip
      Role: !GetAtt ExecutionRole.Arn
      Runtime: java25
      SnapStart:
        ApplyOn: PublishedVersions
      Timeout: 60
      TracingConfig:
        Mode: PassThrough
      Tags:
        - Key: Project
          Value: eacl-demo
        - Key: Profile
          Value: datalevin-memory
        - Key: Storage
          Value: embedded
        - Key: EaclSha
          Value: !Ref EaclSha
        - Key: ArtifactSha256
          Value: !Ref ArtifactSha256

  CandidateVersion:
    Type: AWS::Lambda::Version
    Properties:
      Description: !Sub "${DeploymentId} sha256:${ArtifactSha256} memory:${MemorySize} timeout:60"
      FunctionName: !Ref Function

  CandidateAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Description: !Sub "candidate ${DeploymentId}"
      FunctionName: !Ref Function
      FunctionVersion: !GetAtt CandidateVersion.Version
      Name: !Ref CandidateAliasName

  CandidateFunctionUrl:
    Type: AWS::Lambda::Url
    DependsOn: CandidateAlias
    Properties:
      AuthType: NONE
      Cors:
        AllowHeaders: [accept, content-type, x-eacl-request-id]
        AllowMethods: [GET, POST]
        AllowOrigins: [https://demo.eacl.dev]
        MaxAge: 86400
      InvokeMode: BUFFERED
      Qualifier: !Ref CandidateAliasName
      TargetFunctionArn: !GetAtt Function.Arn

  CandidateFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref CandidateAlias
      FunctionUrlAuthType: NONE
      Principal: "*"

  CandidateFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CandidateAlias
      InvokedViaFunctionUrl: true
      Principal: "*"

Outputs:
  FunctionArn:
    Value: !GetAtt Function.Arn
  FunctionName:
    Value: !Ref Function
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  CandidateVersion:
    Value: !GetAtt CandidateVersion.Version
  CandidateQualifiedName:
    Value: !Sub "${FunctionName}:${CandidateAliasName}"
  CandidateFunctionUrl:
    Value: !GetAtt CandidateFunctionUrl.FunctionUrl
  Runtime:
    Value: java25
  Architecture:
    Value: arm64
  Storage:
    Value: embedded
  SnapStartEnabled:
    Value: "true"
