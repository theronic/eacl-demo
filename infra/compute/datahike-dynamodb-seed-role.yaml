AWSTemplateFormatVersion: "2010-09-09"
Description: Ephemeral exact-generation Datahike build/export EC2 identity.

Parameters:
  TableArn:
    Type: String
    AllowedPattern: "^arn:[a-z0-9-]+:dynamodb:[a-z0-9-]+:[0-9]{12}:table/eacl-demo-datahike-[a-z0-9-]{3,80}$"
  ArtifactBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  SeedArtifactObjectKey:
    Type: String
    AllowedPattern: "^artifacts/datahike-dynamodb/seed/[a-f0-9]{64}/seed\\.jar$"
  SeedArtifactObjectVersion:
    Type: String
    NoEcho: true
    MinLength: 1
    MaxLength: 1024
  FixtureStreamObjectKey:
    Type: String
    AllowedPattern: "^artifacts/datahike-dynamodb/fixtures/[a-f0-9]{64}/fixture-1000000\\.batches\\.jsonl\\.gz$"
  FixtureStreamObjectVersion:
    Type: String
    NoEcho: true
    MinLength: 1
    MaxLength: 1024
  JdkArtifactObjectKey:
    Type: String
    AllowedPattern: "^artifacts/datahike-dynamodb/jdk/[a-f0-9]{64}/amazon-corretto-25-x64-linux-jdk\\.tar\\.gz$"
  JdkArtifactObjectVersion:
    Type: String
    NoEcho: true
    MinLength: 1
    MaxLength: 1024
  StoreArchiveObjectKey:
    Type: String
    AllowedValues:
      - artifacts/datahike-dynamodb/stores/fixture-v1-green/store.tar.gz
  ExportCheckpointObjectKey:
    Type: String
    AllowedValues:
      - checkpoints/datahike-dynamodb/fixture-v1-green/export.json
  SeedEvidenceObjectKey:
    Type: String
    AllowedPattern: "^evidence/datahike-dynamodb/[a-z0-9-]{3,80}/seed-evidence\\.jsonl$"
  AuthorizationId:
    Type: String
    AllowedPattern: "^sha256:[a-f0-9]{64}$"
  RoleName:
    Type: String
    Default: eacl-demo-datahike-seed-fixture-v1-green
    AllowedValues:
      - eacl-demo-datahike-seed-fixture-v1-green
  InstanceProfileName:
    Type: String
    Default: eacl-demo-datahike-seed-fixture-v1-green
    AllowedValues:
      - eacl-demo-datahike-seed-fixture-v1-green

Resources:
  TemporaryWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exact-generation-datahike-storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ExactArtifactBucketAbsenceChecks
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
              - Sid: ExactGenerationSeedDataPlane
                Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !Ref TableArn
              - Sid: ExactImmutableSeedArtifact
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${SeedArtifactObjectKey}
                Condition:
                  StringEquals:
                    s3:VersionId: !Ref SeedArtifactObjectVersion
              - Sid: ExactImmutableFixtureStream
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${FixtureStreamObjectKey}
                Condition:
                  StringEquals:
                    s3:VersionId: !Ref FixtureStreamObjectVersion
              - Sid: ExactImmutableJdkArtifact
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${JdkArtifactObjectKey}
                Condition:
                  StringEquals:
                    s3:VersionId: !Ref JdkArtifactObjectVersion
              - Sid: CompactStoreArchive
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${StoreArchiveObjectKey}
              - Sid: ExportCheckpoint
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ExportCheckpointObjectKey}
              - Sid: ExactSeedEvidenceOutput
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${SeedEvidenceObjectKey}
              - Sid: RequireAwsOwnedS3EncryptionForOutputs
                Effect: Deny
                Action: s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${StoreArchiveObjectKey}
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ExportCheckpointObjectKey}
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${SeedEvidenceObjectKey}
                Condition:
                  StringNotEquals:
                    s3:x-amz-server-side-encryption: AES256
      Tags:
        - Key: Project
          Value: eacl-demo
        - Key: Profile
          Value: datahike-dynamodb
        - Key: Access
          Value: temporary-seed-writer
        - Key: Lifecycle
          Value: temporary
        - Key: AuthorizationId
          Value: !Ref AuthorizationId

  TemporaryWriterInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Ref InstanceProfileName
      Roles:
        - !Ref TemporaryWriterRole

Outputs:
  TemporaryWriterRoleArn:
    Value: !GetAtt TemporaryWriterRole.Arn
  TemporaryWriterInstanceProfileArn:
    Value: !GetAtt TemporaryWriterInstanceProfile.Arn
