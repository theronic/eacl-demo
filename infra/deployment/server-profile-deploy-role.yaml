AWSTemplateFormatVersion: "2010-09-09"
Description: Exact main-branch deployment role for one already-provisioned EACL server profile.

Parameters:
  Activation:
    Type: String
    Default: disabled
    AllowedValues: [disabled, enabled]
  ProfileId:
    Type: String
    AllowedValues: [datahike-s3, datahike-dynamodb, datomic-dynamodb, datalevin-memory]
  RoleName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
  FunctionName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_-]{1,64}$"
  DatomicEc2InstanceId:
    Type: String
    Default: i-01f2d07f50ad1cb5d
    AllowedPattern: "^i-[0-9a-f]{8,17}$"
  ArtifactBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  StaticBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  DistributionId:
    Type: String
    AllowedPattern: "^[A-Z0-9]{8,32}$"

Mappings:
  Profiles:
    datahike-s3:
      Environment: demo-production-datahike-s3
      RoleVariable: AWS_DATAHIKE_S3_DEPLOY_ROLE_ARN
      ComparisonFunction: eacl-demo-datahike-s3-large
      Subject: repo:theronic@1011676/eacl-demo@1345904214:ref:refs/heads/production:workflow_ref:theronic/eacl-demo/.github/workflows/deploy-demos.yml@refs/heads/production:environment:demo-production-datahike-s3:event_name:push:runner_environment:github-hosted
    datahike-dynamodb:
      Environment: demo-production-datahike-dynamodb
      RoleVariable: AWS_DATAHIKE_DYNAMODB_DEPLOY_ROLE_ARN
      ComparisonFunction: eacl-demo-datahike-dynamodb-large
      Subject: repo:theronic@1011676/eacl-demo@1345904214:ref:refs/heads/production:workflow_ref:theronic/eacl-demo/.github/workflows/deploy-demos.yml@refs/heads/production:environment:demo-production-datahike-dynamodb:event_name:push:runner_environment:github-hosted
    datomic-dynamodb:
      Environment: demo-production-datomic-dynamodb
      RoleVariable: AWS_DATOMIC_DYNAMODB_DEPLOY_ROLE_ARN
      ComparisonFunction: eacl-demo-datomic-dynamodb-large
      Subject: repo:theronic@1011676/eacl-demo@1345904214:ref:refs/heads/production:workflow_ref:theronic/eacl-demo/.github/workflows/deploy-demos.yml@refs/heads/production:environment:demo-production-datomic-dynamodb:event_name:push:runner_environment:github-hosted
    datalevin-memory:
      Environment: demo-production-datalevin-memory
      RoleVariable: AWS_DATALEVIN_MEMORY_DEPLOY_ROLE_ARN
      ComparisonFunction: eacl-demo-datalevin-memory-live
      Subject: repo:theronic@1011676/eacl-demo@1345904214:ref:refs/heads/production:workflow_ref:theronic/eacl-demo/.github/workflows/deploy-demos.yml@refs/heads/production:environment:demo-production-datalevin-memory:event_name:push:runner_environment:github-hosted

Conditions:
  ServerDeploymentEnabled: !Equals [!Ref Activation, enabled]
  IsDatomicProfile: !Equals [!Ref ProfileId, datomic-dynamodb]
  IsDatalevinProfile: !Equals [!Ref ProfileId, datalevin-memory]
  UsesSharedEc2: !Or
    - !Condition IsDatomicProfile
    - !Condition IsDatalevinProfile
  HasComparisonPlatform: !Not [!Equals [!Ref ProfileId, datalevin-memory]]

Resources:
  ServerDeployRole:
    Type: AWS::IAM::Role
    Condition: ServerDeploymentEnabled
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ExactGitHubOidcAuthority
            Effect: Allow
            Principal:
              Federated: arn:aws:iam::843761893873:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:environment: !FindInMap [Profiles, !Ref ProfileId, Environment]
                token.actions.githubusercontent.com:ref: refs/heads/production
                token.actions.githubusercontent.com:repository: theronic/eacl-demo
                token.actions.githubusercontent.com:repository_id: "1345904214"
                token.actions.githubusercontent.com:repository_owner_id: "1011676"
                token.actions.githubusercontent.com:sub: !FindInMap [Profiles, !Ref ProfileId, Subject]
                token.actions.githubusercontent.com:workflow: Deploy EACL demos
      Policies:
        - PolicyName: exact-demo-delivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishExactRuntimeArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/artifacts/${ProfileId}/*"
              - Sid: PublishExactProfileRegistry
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${StaticBucketName}/registry/profiles/${ProfileId}.json"
              - Sid: DeployExactLambda
                Effect: Allow
                Action:
                  - lambda:GetAlias
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionConcurrency
                  - lambda:InvokeFunction
                  - lambda:DeleteFunctionConcurrency
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:UpdateAlias
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}*"
              - Sid: DeleteExactStaleLambdaVersions
                Effect: Allow
                Action: lambda:DeleteFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}:*"
              - !If
                - HasComparisonPlatform
                - Sid: DeployExactComparisonLambda
                  Effect: Allow
                  Action:
                    - lambda:GetAlias
                    - lambda:GetFunction
                    - lambda:GetFunctionConfiguration
                    - lambda:GetFunctionConcurrency
                    - lambda:InvokeFunction
                    - lambda:DeleteFunctionConcurrency
                    - lambda:ListVersionsByFunction
                    - lambda:PublishVersion
                    - lambda:UpdateAlias
                    - lambda:UpdateFunctionCode
                    - lambda:UpdateFunctionConfiguration
                  Resource: !Sub
                    - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ComparisonFunctionName}*"
                    - ComparisonFunctionName: !FindInMap [Profiles, !Ref ProfileId, ComparisonFunction]
                - !Ref AWS::NoValue
              - !If
                - HasComparisonPlatform
                - Sid: DeleteExactStaleComparisonLambdaVersions
                  Effect: Allow
                  Action: lambda:DeleteFunction
                  Resource: !Sub
                    - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ComparisonFunctionName}:*"
                    - ComparisonFunctionName: !FindInMap [Profiles, !Ref ProfileId, ComparisonFunction]
                - !Ref AWS::NoValue
              - !If
                - UsesSharedEc2
                - Sid: ReconcileExactSharedEc2Runtime
                  Effect: Allow
                  Action: ssm:SendCommand
                  Resource:
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                    - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${DatomicEc2InstanceId}"
                - !Ref AWS::NoValue
              - Sid: InvalidateExactProfileRegistry
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
      Tags:
        - Key: Project
          Value: eacl-demo
        - Key: Component
          Value: ordinary-server-deployment
        - Key: Profile
          Value: !Ref ProfileId
        - Key: Environment
          Value: !FindInMap [Profiles, !Ref ProfileId, Environment]

Outputs:
  ServerDeployRoleArn:
    Condition: ServerDeploymentEnabled
    Value: !GetAtt ServerDeployRole.Arn
  GitHubVariableName:
    Condition: ServerDeploymentEnabled
    Value: !FindInMap [Profiles, !Ref ProfileId, RoleVariable]
