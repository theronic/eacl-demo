          java-version: 25.0.4+101.0.LTS
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08
        with:
          cli: 1.12.5.1664
      - run: npm ci --ignore-scripts
      - run: npm run build:datahike-s3-lambda
      - id: handoff
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum dist/datahike-s3/function.jar | cut -d ' ' -f 1)"
          echo "artifact_name=eacl-demo-datahike-s3-${digest}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: dist/datahike-s3/function.jar
          if-no-files-found: error
          retention-days: 1

  deploy-datahike-s3:
    needs: build-datahike-s3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: demo-production-datahike-s3
    permissions:
      contents: read
