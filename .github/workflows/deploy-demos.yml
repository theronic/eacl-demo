name: Deploy EACL demos

on:
  push:
    branches:
      - demos

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTIFACT_BUCKET: ${{ vars.EACL_DEMO_ARTIFACT_BUCKET }}
  STATIC_BUCKET: ${{ vars.EACL_DEMO_STATIC_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.EACL_DEMO_DISTRIBUTION_ID }}
  EACL_DEMO_SHA: ${{ github.sha }}

jobs:
  build-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.handoff.outputs.artifact_name }}
      artifact_sha256: ${{ steps.handoff.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08
        with:
          cli: 1.12.5.1664
      - run: npm ci
      - run: npm run build:static-site
      - id: handoff
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum dist/static-site/site-manifest.json | cut -d ' ' -f 1)"
          echo "artifact_name=eacl-demo-static-${digest}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: dist/static-site
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  deploy-static:
    needs: build-static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: demo-production-static
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs['build-static'].outputs.artifact_name }}
          path: dist/static-site
      - name: Verify the static handoff digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs['build-static'].outputs.artifact_sha256 }}
        run: echo "${EXPECTED_SHA256}  dist/static-site/site-manifest.json" | sha256sum --check --strict
      - name: Capture signature-verified allowlisted OIDC claims without retaining the token
        env:
          EACL_OIDC_AUTHORITY_ID: deploy-static
          EACL_OIDC_EXPECTED_SUBJECT_MODE: custom
          EACL_OIDC_CLAIMS_OUTPUT: ${{ runner.temp }}/github-oidc-claims.json
        run: node scripts/capture-github-oidc-claims.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oidc-claims-deploy-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-oidc-claims.json
          if-no-files-found: error
          retention-days: 1
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_STATIC_DEPLOY_ROLE_ARN }}
          role-session-name: eacl-static-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy, merge-smoke, and promote only this target
        run: node scripts/deploy-live-demo.mjs static

  build-datahike-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.handoff.outputs.artifact_name }}
      artifact_sha256: ${{ steps.handoff.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
