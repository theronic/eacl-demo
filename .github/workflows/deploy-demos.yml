name: Deploy EACL demos

on:
  push:
    branches:
      - production

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTIFACT_BUCKET: ${{ vars.EACL_DEMO_ARTIFACT_BUCKET }}
  STATIC_BUCKET: ${{ vars.EACL_DEMO_STATIC_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.EACL_DEMO_DISTRIBUTION_ID }}
  EACL_DEMO_SHA: ${{ github.sha }}

jobs:
  deploy-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: demo-production-static
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664
      - run: npm ci
      - run: npm run build:static-site
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_STATIC_DEPLOY_ROLE_ARN }}
          role-session-name: eacl-static-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and smoke-test the static demo
        run: node scripts/deploy-live-demo.mjs static

  deploy-datahike-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: demo-production-datahike-s3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664
      - run: npm ci --ignore-scripts
      - run: npm run build:datahike-s3-lambda
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DATAHIKE_S3_DEPLOY_ROLE_ARN }}
          role-session-name: eacl-datahike-s3-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and smoke-test Datahike/S3
        run: node scripts/deploy-live-demo.mjs datahike-s3

  deploy-datahike-dynamodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: demo-production-datahike-dynamodb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664
      - run: npm ci --ignore-scripts
      - run: npm run build:datahike-dynamodb-lambda
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DATAHIKE_DYNAMODB_DEPLOY_ROLE_ARN }}
          role-session-name: eacl-datahike-dynamodb-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and smoke-test Datahike/DynamoDB
        run: node scripts/deploy-live-demo.mjs datahike-dynamodb

  deploy-datomic-dynamodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: demo-production-datomic-dynamodb
    permissions:
      contents: read
      id-token: write
    env:
      DATOMIC_DYNAMODB_EC2_INSTANCE_ID: ${{ vars.DATOMIC_DYNAMODB_EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664
      - run: npm ci --ignore-scripts
      - run: npm run build:datomic-lambda
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DATOMIC_DYNAMODB_DEPLOY_ROLE_ARN }}
          role-session-name: eacl-datomic-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and smoke-test Datomic/DynamoDB
        run: node scripts/deploy-live-demo.mjs datomic-dynamodb

  deploy-datalevin-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: demo-production-datalevin-memory
    permissions:
      contents: read
      id-token: write
    env:
      SHARED_EC2_INSTANCE_ID: ${{ vars.DATOMIC_DYNAMODB_EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theronic/datalevin
          ref: a7e29c25a3034b54814e58a2d317e8c6877d1933
          path: target/eacl-core-source/datalevin
          persist-credentials: false
      - name: Fetch the pinned AL2023 arm64 native dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/datalevin-native-al2023
          curl --fail --location --retry 3 \
            --output dist/datalevin-native-al2023/dtlvnative-linux-arm64-0.18.8-eacl.al2023.1.jar \
            https://github.com/theronic/eacl-demo/releases/download/datalevin-native-v0.18.8-eacl.al2023.1/dtlvnative-linux-arm64-0.18.8-eacl.al2023.1.jar
          echo "be264ee95cf67148194a87b9ef9d533d74caa7dbb2f64bac29a1e159498dcb63  dist/datalevin-native-al2023/dtlvnative-linux-arm64-0.18.8-eacl.al2023.1.jar" | sha256sum --check --strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1664
      - run: npm ci --ignore-scripts
      - run: npm run build:datalevin-memory-lambda
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DATALEVIN_MEMORY_DEPLOY_ROLE_ARN }}
          role-session-name: eacl-datalevin-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and smoke-test Datalevin/memory
        run: node scripts/deploy-live-demo.mjs datalevin-memory
