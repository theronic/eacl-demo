name: Stateful Datomic DynamoDB generation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact bounded lifecycle action
        required: true
        type: choice
        options:
          - preview-create
          - apply-create
          - verify
          - backup
          - publish-serving
      table_name:
        description: Exact blue-green Datomic table name
        required: true
        type: string
      generation_id:
        description: Immutable generation identifier
        required: true
        type: string
      fixture_digest:
        description: sha256-prefixed fixture manifest digest
        required: true
        type: string
      seed_evidence_object_version:
        description: Exact S3 version ID emitted by the completed seed; blank before seed
        required: false
        type: string
      seed_evidence_sha256:
        description: Exact SHA-256 of seed evidence without prefix; blank before seed
        required: false
        type: string
      backup_name:
        description: Exact backup name for backup action; otherwise blank
        required: false
        type: string
      expected_phase:
        description: Phase expected after this action
        required: true
        type: choice
        options:
          - seed
          - serving
      confirmation:
        description: Empty for preview/verify; CREATE, BACKUP, or PUBLISH exact target token
        required: false
        type: string

permissions:
  contents: read

jobs:
  exact-generation:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo-stateful-datomic-dynamodb
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ALARM_TOPIC_ARN: ${{ vars.AWS_ALARM_TOPIC_ARN }}
      ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      TABLE_STACK: eacl-demo-datomic-${{ inputs.generation_id }}
      ALARM_STACK: eacl-demo-datomic-${{ inputs.generation_id }}-alarms
      SEED_ROLE_STACK: eacl-demo-datomic-seed-fixture-v1-green
      SEED_ROLE_NAME: eacl-demo-datomic-seed-fixture-v1-green
      SEED_INSTANCE_PROFILE_NAME: eacl-demo-datomic-seed-fixture-v1-green
      TABLE_NAME: ${{ inputs.table_name }}
      GENERATION_ID: ${{ inputs.generation_id }}
      FIXTURE_DIGEST: ${{ inputs.fixture_digest }}
      SEED_EVIDENCE_OBJECT_VERSION: ${{ inputs.seed_evidence_object_version }}
      SEED_EVIDENCE_SHA256: ${{ inputs.seed_evidence_sha256 }}
      SEED_EVIDENCE_KEY: evidence/datomic-dynamodb/fixture-v1-green/seed-evidence.jsonl
      BACKUP_NAME: ${{ inputs.backup_name }}
      EXPECTED_PHASE: ${{ inputs.expected_phase }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SEED_MAX_READ: "250"
      SEED_MAX_WRITE: "200"
      SERVING_MAX_READ: "250"
      SERVING_MAX_WRITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Capture signature-verified allowlisted OIDC claims without retaining the token
        env:
          EACL_OIDC_AUTHORITY_ID: stateful-datomic-dynamodb
          EACL_OIDC_EXPECTED_SUBJECT_MODE: transition
          EACL_OIDC_CLAIMS_OUTPUT: ${{ runner.temp }}/github-oidc-claims.json
        run: node scripts/capture-github-oidc-claims.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-claims-stateful-datomic-dynamodb-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-oidc-claims.json
          if-no-files-found: error
          retention-days: 1
      - name: Validate exact non-secret inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TABLE_NAME" =~ ^eacl-demo-datomic-[a-z0-9-]{3,80}$ ]]
          [[ "$GENERATION_ID" =~ ^[a-z0-9-]{3,80}$ ]]
          [[ "$TABLE_NAME" == eacl-demo-datomic-fixture-v1-green ]]
          [[ "$GENERATION_ID" == fixture-v1-green ]]
          [[ "$FIXTURE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]$ ]]
          [[ "$ALARM_TOPIC_ARN" == "arn:aws:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:"* ]]
          case "$ACTION" in
            preview-create) [[ "$EXPECTED_PHASE" == seed && -z "$CONFIRMATION" && -z "$BACKUP_NAME" && -z "$SEED_EVIDENCE_OBJECT_VERSION" && -z "$SEED_EVIDENCE_SHA256" ]] ;;
            verify)
              [[ -z "$CONFIRMATION" && -z "$BACKUP_NAME" && -n "$SEED_EVIDENCE_OBJECT_VERSION" ]]
              [[ "$SEED_EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
              ;;
            apply-create) [[ "$EXPECTED_PHASE" == seed && -z "$BACKUP_NAME" && -z "$SEED_EVIDENCE_OBJECT_VERSION" && -z "$SEED_EVIDENCE_SHA256" && "$CONFIRMATION" == "CREATE:${TABLE_NAME}:${GENERATION_ID}" ]] ;;
            backup)
              [[ "$EXPECTED_PHASE" == seed && -n "$SEED_EVIDENCE_OBJECT_VERSION" ]]
              [[ "$SEED_EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
              [[ "$BACKUP_NAME" =~ ^eacl-demo-datomic-[a-z0-9-]{3,80}$ ]]
              [[ "$CONFIRMATION" == "BACKUP:${TABLE_NAME}:${GENERATION_ID}:${BACKUP_NAME}" ]]
              ;;
            publish-serving)
              [[ "$EXPECTED_PHASE" == serving && -z "$BACKUP_NAME" && -n "$SEED_EVIDENCE_OBJECT_VERSION" ]]
              [[ "$SEED_EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
              [[ "$CONFIRMATION" == "PUBLISH:${TABLE_NAME}:${GENERATION_ID}" ]]
              ;;
            *) exit 64 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_STATEFUL_DATOMIC_ROLE_ARN }}
          role-session-name: eacl-demo-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify exact AWS account
        shell: bash
        run: |
          set -euo pipefail
          actual="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$actual" == "$AWS_ACCOUNT_ID" ]]
      - name: Require active project cost-allocation tags
        shell: bash
        run: |
          set -euo pipefail
          tags="$(aws ce list-cost-allocation-tags --status Active --type UserDefined --tag-keys Project Workload --output json)"
          node -e '
            const tags=JSON.parse(process.argv[1]).CostAllocationTags;
            const active=new Set(tags.filter(x=>x.Status==="Active" && x.Type==="UserDefined").map(x=>x.TagKey));
            if(!active.has("Project") || !active.has("Workload")) process.exit(1);
          ' "$tags"
      - name: Verify exact immutable seed and normal-Peer history evidence
        if: inputs.action == 'verify' || inputs.action == 'backup' || inputs.action == 'publish-serving'
        shell: bash
        run: |
          set -euo pipefail
          aws s3api get-object --bucket "$ARTIFACT_BUCKET" --key "$SEED_EVIDENCE_KEY" \
            --version-id "$SEED_EVIDENCE_OBJECT_VERSION" "$RUNNER_TEMP/seed-evidence.jsonl" >/dev/null
          printf '%s  %s\n' "$SEED_EVIDENCE_SHA256" "$RUNNER_TEMP/seed-evidence.jsonl" | sha256sum --check --strict
          node -e '
            const fs=require("node:fs");
            const lines=fs.readFileSync(process.argv[1],"utf8").trim().split("\n");
            const final=JSON.parse(lines.at(-1)); const h=final.history||{};
            if(final.kind!=="seed-complete" || final.status!=="ready" || final.manifestDigest!==process.argv[2] ||
               h.historyVerified!==true || h.normalPeer!==true || h.finalResourceCount!==1000000 || h.priorResourceCount<=0 ||
               !(h.priorBasisT<h.contentBasisT && h.contentBasisT<h.publicationBasisT) ||
               JSON.stringify(h.historyStatuses)!==JSON.stringify(["ready","seeding"])) process.exit(1);
          ' "$RUNNER_TEMP/seed-evidence.jsonl" "$FIXTURE_DIGEST"
      - name: Preview table and alarm change sets without execution
        if: inputs.action == 'preview-create'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "$ALARM_STACK" \
            --template-file infra/data/dynamodb-cost-controls.yaml \
            --no-execute-changeset --no-fail-on-empty-changeset \
            --parameter-overrides TableName="$TABLE_NAME" AlarmTopicArn="$ALARM_TOPIC_ARN" \
              MaxReadRequestUnits="$SEED_MAX_READ" MaxWriteRequestUnits="$SEED_MAX_WRITE" Phase=seed
          aws cloudformation deploy --stack-name "$TABLE_STACK" \
            --template-file infra/data/datomic-dynamodb-table.yaml \
            --capabilities CAPABILITY_IAM --no-execute-changeset --no-fail-on-empty-changeset \
            --parameter-overrides TableName="$TABLE_NAME" GenerationId="$GENERATION_ID" \
              FixtureDigest="$FIXTURE_DIGEST" \
              MaxReadRequestUnits="$SEED_MAX_READ" MaxWriteRequestUnits="$SEED_MAX_WRITE" PublicationPhase=seed
      - name: Install quiet alarms before creating the table
        if: inputs.action == 'apply-create'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "$ALARM_STACK" \
            --template-file infra/data/dynamodb-cost-controls.yaml --no-fail-on-empty-changeset \
            --parameter-overrides TableName="$TABLE_NAME" AlarmTopicArn="$ALARM_TOPIC_ARN" \
              MaxReadRequestUnits="$SEED_MAX_READ" MaxWriteRequestUnits="$SEED_MAX_WRITE" Phase=seed
      - name: Create retained protected seed generation
        if: inputs.action == 'apply-create'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "$TABLE_STACK" \
            --template-file infra/data/datomic-dynamodb-table.yaml \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset \
            --parameter-overrides TableName="$TABLE_NAME" GenerationId="$GENERATION_ID" \
              FixtureDigest="$FIXTURE_DIGEST" \
              MaxReadRequestUnits="$SEED_MAX_READ" MaxWriteRequestUnits="$SEED_MAX_WRITE" PublicationPhase=seed
      - name: Create exact on-demand backup
        if: inputs.action == 'backup'
        shell: bash
        run: |
          set -euo pipefail
          backup_arn="$(aws dynamodb create-backup --table-name "$TABLE_NAME" --backup-name "$BACKUP_NAME" --query 'BackupDetails.BackupArn' --output text)"
          [[ "$backup_arn" == "arn:aws:dynamodb:${AWS_REGION}:${AWS_ACCOUNT_ID}:table/${TABLE_NAME}/backup/"* ]]
          status=CREATING
          for attempt in {1..60}; do
            status="$(aws dynamodb describe-backup --backup-arn "$backup_arn" --query 'BackupDescription.BackupDetails.BackupStatus' --output text)"
            [[ "$status" == AVAILABLE ]] && break
            [[ "$status" == CREATING && "$attempt" -lt 60 ]]
            sleep 10
          done
          [[ "$status" == AVAILABLE ]]
      - name: Require a quiet write window before immutable publication
        if: inputs.action == 'publish-serving'
        shell: bash
        run: |
          set -euo pipefail
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start="$(date -u -d '6 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          values="$(aws cloudwatch get-metric-statistics --namespace AWS/DynamoDB \
            --metric-name ConsumedWriteCapacityUnits --dimensions Name=TableName,Value="$TABLE_NAME" \
            --start-time "$start" --end-time "$end" --period 60 --statistics Sum \
            --query 'Datapoints[].Sum' --output json)"
          node -e 'const values=JSON.parse(process.argv[1]); if(values.some((value)=>value!==0)){process.exit(1)}' "$values"
      - name: Require temporary writer cleanup before immutable publication
        if: inputs.action == 'publish-serving'
        shell: bash
        run: |
          set -euo pipefail
          ! aws cloudformation describe-stacks --stack-name "$SEED_ROLE_STACK" >/dev/null 2>&1
          ! aws iam get-role --role-name "$SEED_ROLE_NAME" >/dev/null 2>&1
          ! aws iam get-instance-profile --instance-profile-name "$SEED_INSTANCE_PROFILE_NAME" >/dev/null 2>&1
          instances="$(aws ec2 describe-instances --filters Name=tag:Project,Values=eacl-demo Name=tag:Purpose,Values=datomic-transactor Name=instance-state-name,Values=pending,running,stopping,stopped --query 'Reservations[].Instances[].InstanceId' --output json)"
          volumes="$(aws ec2 describe-volumes --filters Name=tag:Project,Values=eacl-demo Name=tag:Purpose,Values=datomic-transactor Name=status,Values=creating,available,in-use --query 'Volumes[].VolumeId' --output json)"
          addresses="$(aws ec2 describe-addresses --filters Name=tag:Project,Values=eacl-demo Name=tag:Purpose,Values=datomic-transactor --query 'Addresses[].AllocationId' --output json)"
          node -e 'for(const value of process.argv.slice(1).map(JSON.parse)) if(value.length!==0) process.exit(1)' "$instances" "$volumes" "$addresses"
      - name: Install and verify the zero-write transition guard
        if: inputs.action == 'publish-serving'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "$ALARM_STACK" \
            --template-file infra/data/dynamodb-cost-controls.yaml --no-fail-on-empty-changeset \
            --parameter-overrides TableName="$TABLE_NAME" AlarmTopicArn="$ALARM_TOPIC_ARN" \
              MaxReadRequestUnits="$SEED_MAX_READ" MaxWriteRequestUnits="$SEED_MAX_WRITE" Phase=transition
          ready=false
          for attempt in {1..12}; do
            alarm="$(aws cloudwatch describe-alarms --alarm-names "$TABLE_NAME-unexpected-serving-write" --output json)"
            if node -e '
              const alarms=JSON.parse(process.argv[1]).MetricAlarms;
              const topic=process.argv[2];
              if(alarms.length!==1 || alarms[0].StateValue!=="OK" || alarms[0].ActionsEnabled!==true ||
                 JSON.stringify(alarms[0].AlarmActions)!==JSON.stringify([topic]) || alarms[0].OKActions.length!==0) process.exit(1);
            ' "$alarm" "$ALARM_TOPIC_ARN"; then ready=true; break; fi
            [[ "$attempt" -lt 12 ]]
            sleep 15
          done
          [[ "$ready" == true ]]
      - name: Apply immutable serving caps after temporary writer cleanup
        if: inputs.action == 'publish-serving'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "$TABLE_STACK" \
            --template-file infra/data/datomic-dynamodb-table.yaml \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset \
            --parameter-overrides TableName="$TABLE_NAME" GenerationId="$GENERATION_ID" \
              FixtureDigest="$FIXTURE_DIGEST" \
              MaxReadRequestUnits="$SERVING_MAX_READ" MaxWriteRequestUnits="$SERVING_MAX_WRITE" PublicationPhase=serving
      - name: Install immutable-serving alarms after the guarded transition
        if: inputs.action == 'publish-serving'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name "$ALARM_STACK" \
            --template-file infra/data/dynamodb-cost-controls.yaml --no-fail-on-empty-changeset \
            --parameter-overrides TableName="$TABLE_NAME" AlarmTopicArn="$ALARM_TOPIC_ARN" \
              MaxReadRequestUnits="$SERVING_MAX_READ" MaxWriteRequestUnits="$SERVING_MAX_WRITE" Phase=serving
      - name: Verify post-transition write telemetry remains quiet
        if: inputs.action == 'publish-serving'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start="$(date -u -d '3 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
            values="$(aws cloudwatch get-metric-statistics --namespace AWS/DynamoDB \
              --metric-name ConsumedWriteCapacityUnits --dimensions Name=TableName,Value="$TABLE_NAME" \
              --start-time "$start" --end-time "$end" --period 60 --statistics Sum \
              --query 'Datapoints[].Sum' --output json)"
            if node -e 'const values=JSON.parse(process.argv[1]); process.exit(values.some((value)=>value!==0)?1:0)' "$values"; then
              break
            fi
            [[ "$attempt" -lt 12 ]]
            sleep 30
          done
      - name: Verify exact table identity, protection, schema, recovery, phase, and caps
        if: inputs.action != 'preview-create'
        shell: bash
        run: |
          set -euo pipefail
          table="$(aws dynamodb describe-table --table-name "$TABLE_NAME" --output json)"
          expected_read="$SEED_MAX_READ"
          expected_write="$SEED_MAX_WRITE"
          if [[ "$EXPECTED_PHASE" == serving ]]; then expected_read="$SERVING_MAX_READ"; expected_write="$SERVING_MAX_WRITE"; fi
          node -e '
            const d=JSON.parse(process.argv[1]).Table;
            const [name,read,write]=process.argv.slice(2);
            const schema=JSON.stringify(d.KeySchema);
            const attrs=JSON.stringify(d.AttributeDefinitions);
            const sse=d.SSEDescription;
            if(d.TableName!==name || d.TableStatus!=="ACTIVE" || d.DeletionProtectionEnabled!==true ||
               d.BillingModeSummary?.BillingMode!=="PAY_PER_REQUEST" || schema!==JSON.stringify([{AttributeName:"id",KeyType:"HASH"}]) ||
               attrs!==JSON.stringify([{AttributeName:"id",AttributeType:"S"}]) || sse?.SSEType==="KMS" || sse?.KMSMasterKeyArn ||
               d.OnDemandThroughput?.MaxReadRequestUnits!==Number(read) || d.OnDemandThroughput?.MaxWriteRequestUnits!==Number(write)) process.exit(1);
          ' "$table" "$TABLE_NAME" "$expected_read" "$expected_write"
          pitr="$(aws dynamodb describe-continuous-backups --table-name "$TABLE_NAME" --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' --output text)"
          [[ "$pitr" == ENABLED ]]
          table_arn="$(node -e 'console.log(JSON.parse(process.argv[1]).Table.TableArn)' "$table")"
          tags="$(aws dynamodb list-tags-of-resource --resource-arn "$table_arn" --output json)"
          node -e '
            const tags=Object.fromEntries(JSON.parse(process.argv[1]).Tags.map(({Key,Value})=>[Key,Value]));
            const [generation,digest,phase]=process.argv.slice(2);
            if(tags.Generation!==generation || tags.FixtureDigest!==digest || tags.PublicationPhase!==phase) process.exit(1);
          ' "$tags" "$GENERATION_ID" "$FIXTURE_DIGEST" "$EXPECTED_PHASE"
