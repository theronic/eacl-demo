name: Migrate demo storage to v8

on:
  workflow_dispatch:
    inputs:
      action:
        description: Migrate an isolated copy, or admit readers after a successful migration run
        required: true
        default: migrate
        type: choice
        options: [migrate, publish-readers]
      profile:
        description: Exact retained source to copy and migrate
        required: true
        type: choice
        options: [datahike-s3, datahike-dynamodb, datomic-dynamodb]
      confirmation:
        description: MIGRATE-V8 or PUBLISH-V8 followed by a colon and the selected profile
        required: true
        type: string
      migration_run:
        description: Successful migration run ID required only for publishing reader access
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: storage-v8-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: demo-storage-v8-migration
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      PROFILE: ${{ inputs.profile }}
      CONFIRMATION: ${{ inputs.confirmation }}
      ACTION: ${{ inputs.action }}
      MIGRATION_RUN: ${{ inputs.migration_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the explicitly requested migration
        run: |
          set -euo pipefail
          case "$PROFILE" in datahike-s3|datahike-dynamodb|datomic-dynamodb) ;; *) exit 64;; esac
          case "$ACTION" in
            migrate) [[ "$CONFIRMATION" == "MIGRATE-V8:${PROFILE}" && -z "$MIGRATION_RUN" ]] ;;
            publish-readers) [[ "$CONFIRMATION" == "PUBLISH-V8:${PROFILE}" && "$MIGRATION_RUN" =~ ^[1-9][0-9]+$ ]] ;;
            *) exit 64 ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-storage-v8-${{ inputs.profile }}-${{ hashFiles('deps.edn') }}
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d
        with:
          cli: 1.12.5.1664
      - name: Prepare pinned maintenance code before acquiring AWS credentials
        run: |
          if [[ "$ACTION" == migrate ]]; then node scripts/prepare-storage-v8.mjs "$PROFILE"; fi
          python3 -m venv target/storage-v8/venv
          target/storage-v8/venv/bin/pip install boto3==1.42.49
      - name: Bind publication to a completed migration run and its exact profile artifact
        if: inputs.action == 'publish-readers'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "target/storage-v8/$PROFILE/verified-migration"
          gh run view "$MIGRATION_RUN" --json conclusion,event,workflowName,headBranch > "target/storage-v8/$PROFILE/verified-run.json"
          python3 - "$PROFILE" <<'PY'
          import json,sys
          from pathlib import Path
          value=json.loads(Path(f"target/storage-v8/{sys.argv[1]}/verified-run.json").read_text())
          assert value == {"conclusion":"success", "event":"workflow_dispatch", "workflowName":"Migrate demo storage to v8", "headBranch":"production"}, value
          PY
          gh run download "$MIGRATION_RUN" --name "storage-v8-$PROFILE-$MIGRATION_RUN" --dir "target/storage-v8/$PROFILE/verified-migration"
      - name: Capture signature-verified allowlisted OIDC claims
        env:
          EACL_OIDC_AUTHORITY_ID: storage-v8-migration
          EACL_OIDC_EXPECTED_SUBJECT_MODE: custom
          EACL_OIDC_CLAIMS_OUTPUT: ${{ runner.temp }}/github-oidc-claims.json
        run: node scripts/capture-github-oidc-claims.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oidc-claims-storage-v8-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-oidc-claims.json
          if-no-files-found: error
          retention-days: 1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_STORAGE_V8_MIGRATION_ROLE_ARN }}
          role-session-name: storage-v8-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 18000
          aws-region: us-east-1
      - name: Copy retained source, run native migrations, and verify content
        run: |
          export PATH="$PWD/target/storage-v8/venv/bin:$PATH"
          python3 scripts/migrate-storage-v8.py "$PROFILE" "$ACTION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: storage-v8-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            target/storage-v8/${{ inputs.profile }}/*.jsonl
            target/storage-v8/${{ inputs.profile }}/complete.json
            target/storage-v8/${{ inputs.profile }}/transactor.log
          if-no-files-found: warn
          retention-days: 7
