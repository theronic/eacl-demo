name: Exercise one profile runtime manually

on:
  workflow_dispatch:
    inputs:
      exercise:
        description: Bounded assurance campaign
        required: true
        type: choice
        options:
          - load
          - memory
          - fault
      profile_id:
        description: Exact registered server profile ID
        required: true
        type: string
      base_url:
        description: Exact staged CloudFront profile URL for load/fault; unused for memory
        required: false
        type: string
      demo_sha:
        description: Exact deployed eacl-demo SHA
        required: true
        type: string
      eacl_sha:
        description: Exact locked EACL Core SHA
        required: true
        type: string
      artifact_sha256:
        description: Exact deployed ZIP/JAR SHA-256 without prefix
        required: true
        type: string
      deployment_id:
        description: Exact immutable deployment identifier
        required: true
        type: string
      data_manifest_sha256:
        description: Exact data-manifest SHA-256 without prefix
        required: true
        type: string
      function_name:
        description: Exact Lambda function name; required only for memory
        required: false
        type: string
      function_version:
        description: Exact published numeric Lambda version; required only for memory
        required: false
        type: string
      request_count:
        description: Load requests, bounded from 20 through 500
        required: true
        default: "100"
        type: string
      concurrency:
        description: Load concurrency, bounded from 1 through 8
        required: true
        default: "2"
        type: string
      confirmation:
        description: EXERCISE:<exercise>:<profile>:<deployment-id>
        required: true
        type: string

permissions:
  contents: read

jobs:
  http-exercise:
    if: github.ref == 'refs/heads/demos' && inputs.exercise != 'memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Run exact bounded staged HTTP exercise
        run: npm run exercise:profile-runtime
        env:
          EACL_EXERCISE_KIND: ${{ inputs.exercise }}
          EACL_PROFILE_ID: ${{ inputs.profile_id }}
          EACL_QUALIFICATION_BASE_URL: ${{ inputs.base_url }}
          EACL_EXPECTED_STAGED_ORIGIN: ${{ vars.STAGED_CLOUDFRONT_ORIGIN }}
          EACL_DEMO_SHA: ${{ inputs.demo_sha }}
          EACL_CORE_SHA: ${{ inputs.eacl_sha }}
          EACL_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          EACL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EACL_DATA_MANIFEST_SHA256: ${{ inputs.data_manifest_sha256 }}
          EACL_FUNCTION_NAME: ${{ inputs.function_name }}
          EACL_FUNCTION_VERSION: ${{ inputs.function_version }}
          EACL_REQUEST_COUNT: ${{ inputs.request_count }}
          EACL_CONCURRENCY: ${{ inputs.concurrency }}
          EACL_REQUEST_TIMEOUT_MS: "10000"
          EACL_MAXIMUM_P95_MS: "5000"
          EACL_MAXIMUM_ERROR_RATE: "0"
          EACL_MEMORY_SAMPLES: "20"
          EACL_MINIMUM_HEADROOM_PERCENT: "20"
          EACL_MAXIMUM_INITIALIZATION_MS: "10000"
          EACL_MAXIMUM_RESTORE_MS: "10000"
          EACL_MAXIMUM_DURATION_MS: "10000"
          EACL_EXERCISE_CONFIRMATION: ${{ inputs.confirmation }}
          EACL_EXERCISE_OUTPUT: verification/results/${{ inputs.profile_id }}-${{ inputs.exercise }}-${{ github.run_id }}-${{ github.run_attempt }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-exercise-${{ inputs.profile_id }}-${{ inputs.exercise }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/results/
          if-no-files-found: error
          retention-days: 30

  memory-exercise:
    if: github.ref == 'refs/heads/demos' && inputs.exercise == 'memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo-manual-qualification
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Capture signature-verified allowlisted OIDC claims without retaining the token
        env:
          EACL_OIDC_AUTHORITY_ID: qualify-profile-memory
          EACL_OIDC_EXPECTED_SUBJECT_MODE: transition
          EACL_OIDC_CLAIMS_OUTPUT: ${{ runner.temp }}/github-oidc-claims.json
        run: node scripts/capture-github-oidc-claims.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oidc-claims-qualify-profile-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-oidc-claims.json
          if-no-files-found: error
          retention-days: 1
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_QUALIFICATION_ROLE_ARN }}
          role-session-name: eacl-demo-memory-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify exact AWS account
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$AWS_ACCOUNT_ID" ]]
      - name: Invoke only the exact published version and capture Lambda REPORT evidence
        run: node scripts/exercise-profile-runtime.mjs
        env:
          EACL_EXERCISE_KIND: ${{ inputs.exercise }}
          EACL_PROFILE_ID: ${{ inputs.profile_id }}
          EACL_QUALIFICATION_BASE_URL: ${{ inputs.base_url }}
          EACL_EXPECTED_STAGED_ORIGIN: ${{ vars.STAGED_CLOUDFRONT_ORIGIN }}
          EACL_DEMO_SHA: ${{ inputs.demo_sha }}
          EACL_CORE_SHA: ${{ inputs.eacl_sha }}
          EACL_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          EACL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EACL_DATA_MANIFEST_SHA256: ${{ inputs.data_manifest_sha256 }}
          EACL_FUNCTION_NAME: ${{ inputs.function_name }}
          EACL_FUNCTION_VERSION: ${{ inputs.function_version }}
          EACL_REQUEST_COUNT: ${{ inputs.request_count }}
          EACL_CONCURRENCY: ${{ inputs.concurrency }}
          EACL_REQUEST_TIMEOUT_MS: "10000"
          EACL_MAXIMUM_P95_MS: "5000"
          EACL_MAXIMUM_ERROR_RATE: "0"
          EACL_MEMORY_SAMPLES: "20"
          EACL_MINIMUM_HEADROOM_PERCENT: "20"
          EACL_MAXIMUM_INITIALIZATION_MS: "10000"
          EACL_MAXIMUM_RESTORE_MS: "10000"
          EACL_MAXIMUM_DURATION_MS: "10000"
          EACL_EXERCISE_CONFIRMATION: ${{ inputs.confirmation }}
          EACL_EXERCISE_OUTPUT: verification/results/${{ inputs.profile_id }}-${{ inputs.exercise }}-${{ github.run_id }}-${{ github.run_attempt }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-exercise-${{ inputs.profile_id }}-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/results/
          if-no-files-found: error
          retention-days: 30
