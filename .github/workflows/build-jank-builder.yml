name: Build pinned Jank AL2023 x86_64 builder

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: BUILD:<exact-workload-digest-without-sha256-prefix>:<exact-demo-commit>
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify exact workload and immutable checkout confirmation
        env:
          EACL_DEMO_SHA: ${{ github.sha }}
          EACL_JANK_BUILDER_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/verify-jank-builder-workload.mjs --confirm
      - uses: thejerrybao/setup-swap-space@466d59798fb9263b9c2331c83cf71f9b7bfd0c78
        with:
          swap-space-path: /swapfile
          swap-size-gb: 8
          remove-existing-swap-files: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/builders/jank-al2023-x86_64.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/theronic/eacl-demo-jank-builder:jank-489760dc927cd22900a4ab150dbab947ec25ad00-al2023-amd64
      - name: Verify immutable published digest and platform
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="ghcr.io/theronic/eacl-demo-jank-builder@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image" | tee /tmp/jank-builder-inspect.txt
          grep -Eq 'Platform:[[:space:]]+linux/amd64|linux/amd64' /tmp/jank-builder-inspect.txt
      - name: Build and smoke the qualification-only AL2023 Lambda ZIP
        env:
          EACL_JANK_BUILDER_IMAGE: ghcr.io/theronic/eacl-demo-jank-builder@${{ steps.build.outputs.digest }}
          EACL_JANK_QUALIFICATION_BUILD: "1"
          EACL_DEMO_SHA: ${{ github.sha }}
          EACL_CORE_SHA: 1cbf80c7aaf4bfcf2564d2bf30135794ff406383
          EACL_DATA_MANIFEST_SHA256: b537a6755026fbbc36f68289dc0f35d09a7cd965397d67d9380a6f820963294a
        run: node scripts/build-jank-memory.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jank-al2023-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/jank-memory/
            /tmp/jank-builder-inspect.txt
          if-no-files-found: warn
          retention-days: 1
