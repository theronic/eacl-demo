name: Build pinned Jank AL2023 x86_64 builder

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: BUILD:<exact-workload-digest-without-sha256-prefix>:<exact-demo-commit>
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify exact workload and immutable checkout confirmation
        env:
          EACL_DEMO_SHA: ${{ github.sha }}
          EACL_JANK_BUILDER_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/verify-jank-builder-workload.mjs --confirm
      - name: Configure 8 GiB swap for the Jank compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo swapoff --all
          sudo fallocate --length 8G /swapfile
          sudo chmod 0600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/builders/jank-al2023-x86_64.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/theronic/eacl-demo-jank-builder:jank-489760dc927cd22900a4ab150dbab947ec25ad00-al2023-amd64
      - name: Verify immutable published digest and platform
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="ghcr.io/theronic/eacl-demo-jank-builder@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image" | tee /tmp/jank-builder-inspect.txt
          grep -Eq 'Platform:[[:space:]]+linux/amd64|linux/amd64' /tmp/jank-builder-inspect.txt
      - name: Build and smoke the qualification-only AL2023 Lambda ZIP
        env:
          EACL_JANK_BUILDER_IMAGE: ghcr.io/theronic/eacl-demo-jank-builder@${{ steps.build.outputs.digest }}
          EACL_JANK_QUALIFICATION_BUILD: "1"
          EACL_DEMO_SHA: ${{ github.sha }}
          EACL_CORE_SHA: 1cbf80c7aaf4bfcf2564d2bf30135794ff406383
          EACL_DATA_MANIFEST_SHA256: b537a6755026fbbc36f68289dc0f35d09a7cd965397d67d9380a6f820963294a
        run: node scripts/build-jank-memory.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jank-al2023-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/jank-memory/
            /tmp/jank-builder-inspect.txt
          if-no-files-found: warn
          retention-days: 1
