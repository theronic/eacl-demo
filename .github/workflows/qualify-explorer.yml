name: Qualify explorer browsers and accessibility

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional staged https:// URL; blank qualifies the locally built shell
        required: false
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build:static-site
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qualify:explorer
        env:
          EACL_QUALIFICATION_BASE_URL: ${{ inputs.base_url }}
          EACL_EXPECTED_STAGED_ORIGIN: ${{ vars.STAGED_CLOUDFRONT_ORIGIN }}
      - name: Qualify DataScript worker execution and main-bundle network isolation
        env:
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_STAGED_ORIGIN: ${{ vars.STAGED_CLOUDFRONT_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_URL" ]]; then
            node scripts/serve-static-site.mjs 4174 > "$RUNNER_TEMP/static-preview.log" 2>&1 &
            preview_pid="$!"
            trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent --show-error http://127.0.0.1:4174/ >/dev/null; then break; fi
              [[ "$attempt" -lt 30 ]]
              sleep 1
            done
            datascript_url=http://127.0.0.1:4174/datascript/
            main_url=http://127.0.0.1:4174/
          else
            node -e '
              const actual=new URL(process.argv[1]); const expected=new URL(process.argv[2]);
              if(actual.origin!==expected.origin || actual.pathname!=="/" || actual.search || actual.hash || expected.protocol!=="https:" || expected.pathname!=="/" || expected.search || expected.hash || expected.username || expected.password || expected.port) process.exit(1);
            ' "$BASE_URL" "$EXPECTED_STAGED_ORIGIN"
            base="${BASE_URL%/}"
            datascript_url="$base/datascript/"
            main_url="$base/"
          fi
          EACL_DATASCRIPT_URL="$datascript_url" npm run qualify:datascript-browser
          EACL_MAIN_URL="$main_url" npm run qualify:main-network-isolation
